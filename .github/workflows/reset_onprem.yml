name: Reset onprem branches to 13.0

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 13.0

      - name: Reset configured branches to 13.0
        env:
          ONPREM_BRANCHES: ${{ vars.ONPREM_BRANCHES }}
        run: |
          set -euo pipefail

          if [ -z "${ONPREM_BRANCHES:-}" ]; then
            echo "ONPREM_BRANCHES variable is not set - nothing to reset."
            exit 0
          fi

          git fetch origin 13.0
          TARGET_SHA="$(git rev-parse origin/13.0)"
          echo "Resetting to 13.0 @ ${TARGET_SHA}"

          IFS=',' read -ra BRANCHES <<< "${ONPREM_BRANCHES}"
          for raw in "${BRANCHES[@]}"; do
            branch="$(echo "$raw" | xargs)"
            [ -z "$branch" ] && continue
            echo "::group::Reset ${branch}"
            git push origin "+${TARGET_SHA}:refs/heads/${branch}"
            echo "::endgroup::"
          done
